name: PR review

# Reusable. A consuming repository holds a stub of about a dozen lines that
# calls this workflow; everything that decides how the review behaves lives
# here, in one place. See docs/adr/0008-distribution.md and
# templates/consumer-review.yml.
#
# It does not build, lint or test anything. That is the caller's job, expressed
# as a job this one `needs:` — because two hundred microservices do not share
# one build. go-checks.yml in this repository is the strict Go gate for the
# ones that do.
on:
  workflow_call:
    inputs:
      effort:
        description: "low | medium | high — the precision-against-coverage dial"
        type: string
        default: medium
      min_confidence:
        description: >
          The floor a finding must reach, judged by the verifier, to be posted
          at all. Lowering this is a deliberate act with a measurable cost;
          see docs/adr/0007-confidence-is-computed-and-gated.md.
        type: string
        default: high
      holdout_every:
        description: >
          Every Nth pull request is reviewed with the learned rules switched
          off, so the loop's improvement can be checked against a slice it did
          not learn from. 0 disables the holdout and makes any reported
          improvement unverifiable.
        type: number
        default: 5
      reviewer_ref:
        description: "Tag or branch of review-loop to install the skills from."
        type: string
        default: v1
      model:
        description: "Model for the orchestrator. Specialists pin their own."
        type: string
        default: claude-opus-5
      max_turns:
        type: number
        default: 60
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Deliberately not cancel-in-progress. A review that has begun posting must
  # be allowed to finish: a cancelled one leaves some comments posted and the
  # rest nowhere, and the run that would have recorded what it dropped dies
  # with it. The conversation-aware suppression in the skill makes the extra
  # run cheap — it re-derives, sees what is already there, and posts only the
  # remainder. docs/failure-modes.md.
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The skill reads surrounding code and compares against the base.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EFFORT: ${{ inputs.effort }}
          REVIEW_MIN_CONFIDENCE: ${{ inputs.min_confidence }}
          REVIEW_HOLDOUT_EVERY: ${{ inputs.holdout_every }}
          # The commit of the repository this workflow was called from — that
          # is, the reviewer's own version. It goes in every comment marker so
          # a change in precision can be attributed to the change in text that
          # caused it. docs/adr/0006-attribution-and-the-holdout.md.
          REVIEWER_VERSION: ${{ github.job_workflow_sha }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The skills and agents come from review-loop, not from the repository
          # under review. That is the whole point: fixing the reviewer is one
          # commit here, not a pull request against two hundred services.
          plugin_marketplaces: https://github.com/tokamak93/review-loop.git#${{ inputs.reviewer_ref }}
          plugins: review-loop@review-loop
          # Puts the skill's REVIEW SUMMARY in the job summary. It is the only
          # durable record of what was suppressed, gated or capped — none of
          # which is visible from the GitHub API afterwards.
          display_report: true
          # Setting `prompt` runs the action in automation mode: no trigger
          # phrase, no tracking comment, one pass and done.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }} using the pr-review skill.

            Build, lint and tests have already passed on this revision — the
            job that gates this one would have failed otherwise. Do not report
            anything those tools would have caught.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*)"
            --disallowedTools "Edit,Write,WebSearch,WebFetch"
